# Hyprland look and feel overrides (optional)
decoration {
    rounding = 10
       # Opacity settings
    active_opacity = 0.8
    inactive_opacity = 0.6

    blur {
        enabled = true
        size = 2        # How big the blur is (e.g., 3, 8, 10)
        passes = 3       # How many times to blur (e.g., 1, 2, 3)
        # -- Optional settings to control the "feel" ---
        # More performance-friendly blur (may look different)
        new_optimizations = true
        # Ignores window opacity, blurs at full strength
        ignore_opacity = true 
        # How much noise to add (0.0 - 1.0)
        noise = 0
        # Contrast modulation (0.0 - 2.0)
        contrast = 1.0
        # Brightness modulation (0.0 - 2.0)
        brightness = 0.7
        # Inease saturation of blurred colors (0.0 - 1.0)
        vibrancy = 0.1696 
        popups = true
    }
}

xwayland {
    enabled = true
}

