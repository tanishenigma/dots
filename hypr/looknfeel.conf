# Add any other personal Hyprland configuration below
#windowrule = match:class qemu, workspace 5
windowrule = match:class ^(brave-web\.whatsapp\.com__-Default)$, float 1
windowrule = match:class ^(brave-web\.whatsapp\.com__-Default)$, center 1
windowrule = match:class ^(brave-web\.whatsapp\.com__-Default)$, size 900 700
windowrule = match:class ^(brave-web\.whatsapp\.com__-Default)$, pin 1

# Network Login Popup
windowrule = match:class ^(brave-172\.16\.73\.12__httpclient\.html-Default)$, workspace special:netlogin
windowrule = match:class ^(brave-172\.16\.73\.12__httpclient\.html-Default)$, float 1
windowrule = match:class ^(brave-172\.16\.73\.12__httpclient\.html-Default)$, center 1
windowrule = match:class ^(brave-172\.16\.73\.12__httpclient\.html-Default)$, size 350 500

# 1. Float the window while it is still loading ("Untitled")
windowrule = match:class ^(brave-browser)$, match:title ^(Untitled - Brave)$, float 1
windowrule = match:class ^(brave-browser)$, match:title ^(Untitled - Brave)$, center 1
windowrule = match:class ^(brave-browser)$, match:title ^(Untitled - Brave)$, size 500 700

# 2. Keep it floating when the title updates to "Sign in..."
windowrule = match:title ^(Sign in - Google Accounts - Brave)$, float 1
windowrule = match:title ^(Sign in - Google Accounts - Brave)$, center 1
windowrule = match:title ^(Sign in - Google Accounts - Brave)$, size 500 700

# 3. Force normal "New Tab" windows back to tiling if they floated by accident
windowrule = match:class ^(brave-browser)$, match:title ^(New Tab - Brave)$, tile 1